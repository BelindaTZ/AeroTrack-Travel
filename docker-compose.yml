version: '3.8'

# ─────────────────────────────────────────
#  AEROTRACK TRAVEL — infraestructura nueva y aislada
#  100% independiente del proyecto minio-elt (AeroTrack Analytics):
#  PocketBase, Airflow y MinIO son instancias propias, con sus propios
#  volúmenes y credenciales. No hace falta levantar minio-elt para nada.
# ─────────────────────────────────────────

networks:
  travel-network:
    driver: bridge

volumes:
  pocketbase-travel-data:
  postgres-travel-data:
  minio-travel-data:

services:

  # ── POCKETBASE (Travel) — instancia y volumen propios ──────
  pocketbase-travel:
    image: ghcr.io/muchobien/pocketbase:0.22.4
    container_name: pocketbase-travel
    ports:
      - "${PB_TRAVEL_PORT:-8091}:8090"   # UI en http://localhost:8091/_/
    environment:
      TZ: America/Guayaquil
    volumes:
      - pocketbase-travel-data:/pb_data
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MINIO (Travel) — instancia y volumen propios, sin depender de Analytics ──
  minio-travel:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-travel
    ports:
      - "${MINIO_TRAVEL_PORT:-9002}:9000"   # API S3
      - "${MINIO_TRAVEL_CONSOLE_PORT:-9003}:9001"   # Consola web
    environment:
      TZ: America/Guayaquil
      MINIO_ROOT_USER: ${MINIO_TRAVEL_ACCESS:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_TRAVEL_SECRET:-admin1234}
    command: server /data --console-address ":9001"
    volumes:
      - minio-travel-data:/data
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ── MINIO-TRAVEL-INIT (crea el bucket aerotrack-travel-dims) ──
  minio-travel-init:
    image: quay.io/minio/mc:latest
    container_name: minio-travel-init
    depends_on:
      minio-travel:
        condition: service_healthy
    networks:
      - travel-network
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        mc alias set localtravel http://minio-travel:9000 ${MINIO_TRAVEL_ACCESS:-admin} ${MINIO_TRAVEL_SECRET:-admin1234};
        mc mb --ignore-existing localtravel/${MINIO_BUCKET_TRAVEL_DIMS:-aerotrack-travel-dims};
        echo 'Bucket de Travel listo.';
      "

  # ── APP FASTAPI (Travel) — módulos operativos (Seguridad, Vuelos, ...) ──
  app-travel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-travel
    ports:
      - "${APP_TRAVEL_PORT:-8001}:8000"
    environment:
      TZ: America/Guayaquil
      PB_TRAVEL_URL: ${PB_TRAVEL_URL_DOCKER}
      PB_TRAVEL_EMAIL: ${PB_TRAVEL_EMAIL}
      PB_TRAVEL_PASSWORD: ${PB_TRAVEL_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      TOKEN_EXPIRE_MINUTES: ${TOKEN_EXPIRE_MINUTES:-60}
      MINIO_URL_DOCKER: ${MINIO_TRAVEL_URL_DOCKER:-minio-travel:9000}
      MINIO_ACCESS: ${MINIO_TRAVEL_ACCESS:-admin}
      MINIO_SECRET: ${MINIO_TRAVEL_SECRET:-admin1234}
      MINIO_BUCKET_TRAVEL_DIMS: ${MINIO_BUCKET_TRAVEL_DIMS:-aerotrack-travel-dims}
    depends_on:
      pocketbase-travel:
        condition: service_healthy
      minio-travel:
        condition: service_healthy
    networks:
      - travel-network
    restart: unless-stopped

  # ── POSTGRES (metadatos del Airflow de Travel) — dedicado ──
  postgres-travel:
    image: postgres:15
    container_name: postgres-airflow-travel
    environment:
      POSTGRES_USER: ${POSTGRES_TRAVEL_USER:-airflow_travel}
      POSTGRES_PASSWORD: ${POSTGRES_TRAVEL_PASSWORD:-airflow_travel}
      POSTGRES_DB: airflow_travel
    volumes:
      - postgres-travel-data:/var/lib/postgresql/data
    networks:
      - travel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TRAVEL_USER:-airflow_travel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AIRFLOW INIT (Travel) — corre una sola vez ─────────────
  airflow-init-travel:
    image: apache/airflow:2.9.3-python3.12
    container_name: airflow-init-travel
    depends_on:
      postgres-travel:
        condition: service_healthy
    environment:
      TZ: America/Guayaquil
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_TRAVEL_USER:-airflow_travel}:${POSTGRES_TRAVEL_PASSWORD:-airflow_travel}@postgres-travel/airflow_travel
      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY_TRAVEL}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_TRAVEL_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_TRAVEL_ADMIN_PASSWORD:-admin1234}
      PYTHONPATH: /opt/airflow
    command: bash -c "airflow db migrate && airflow users create --username ${AIRFLOW_TRAVEL_ADMIN_USER:-admin} --password ${AIRFLOW_TRAVEL_ADMIN_PASSWORD:-admin1234} --firstname Belinda --lastname Toaquiza --role Admin --email ${PB_EMAIL} || true"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    networks:
      - travel-network
    restart: "no"

  # ── AIRFLOW WEBSERVER (Travel) ─────────────────────────────
  airflow-webserver-travel:
    image: apache/airflow:2.9.3-python3.12
    container_name: airflow-webserver-travel
    depends_on:
      postgres-travel:
        condition: service_healthy
      airflow-init-travel:
        condition: service_completed_successfully
      minio-travel:
        condition: service_healthy
    ports:
      - "${AIRFLOW_TRAVEL_PORT:-8081}:8080"   # UI en http://localhost:8081
    environment:
      TZ: America/Guayaquil
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_TRAVEL_USER:-airflow_travel}:${POSTGRES_TRAVEL_PASSWORD:-airflow_travel}@postgres-travel/airflow_travel
      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY_TRAVEL}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__FAB__UPDATE_FAB_PERMS: 'true'
      _PIP_ADDITIONAL_REQUIREMENTS: "requests pandas pyarrow minio python-dotenv"
      PYTHONPATH: /opt/airflow
    env_file:
      - .env
    command: webserver
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    networks:
      - travel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── AIRFLOW SCHEDULER (Travel) ─────────────────────────────
  airflow-scheduler-travel:
    image: apache/airflow:2.9.3-python3.12
    container_name: airflow-scheduler-travel
    depends_on:
      postgres-travel:
        condition: service_healthy
      airflow-init-travel:
        condition: service_completed_successfully
      minio-travel:
        condition: service_healthy
    environment:
      TZ: America/Guayaquil
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_TRAVEL_USER:-airflow_travel}:${POSTGRES_TRAVEL_PASSWORD:-airflow_travel}@postgres-travel/airflow_travel
      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY_TRAVEL}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      _PIP_ADDITIONAL_REQUIREMENTS: "requests pandas pyarrow minio python-dotenv docker"
      PYTHONPATH: /opt/airflow
    env_file:
      - .env
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      # Socket de Docker del host — SOLO en el scheduler (es el que ejecuta
      # código de tareas bajo LocalExecutor), no en el webserver. Usado
      # únicamente por aerotrack_travel_sync_dims para arrancar los 5
      # contenedores de Analytics que hagan falta antes de disparar su ELT.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - travel-network
    restart: unless-stopped
