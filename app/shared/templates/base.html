<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AeroTrack Travel{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <style>
        :root {
            --at-primary: #0b3d66;
            --at-accent: #e08a1e;
            --at-surface: #ffffff;
            --at-border: #d8dee5;
            --at-muted: #5a6b7a;
            --at-destructive: #b3261e;
        }
        body { background-color: #f4f6f8; color: #14212b; }
        .btn-primary { background-color: var(--at-primary); border-color: var(--at-primary); }
        .btn-accent { background-color: var(--at-accent); border-color: var(--at-accent); color: #14212b; }
        .navbar-brand { font-weight: 600; color: var(--at-primary) !important; }
        .toast-autodismiss { animation: at-fadeout 0.3s ease-in 4.5s forwards; }
        @keyframes at-fadeout { to { opacity: 0; visibility: hidden; } }
        @media (prefers-reduced-motion: reduce) { .toast-autodismiss { animation: none; } }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand" href="/">AeroTrack Travel</a>
        </div>
    </nav>

    <main class="container py-4">
        {% if request.query_params.get('mensaje') %}
        <div class="alert alert-info toast-autodismiss d-flex align-items-center gap-2" role="status">
            <span>&#8505;</span>
            <span>{{ request.query_params.get('mensaje') }}</span>
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
