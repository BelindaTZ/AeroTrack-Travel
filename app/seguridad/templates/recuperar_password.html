{% extends "layout_publico.html" %}
{% block title %}Recuperar contraseña — AeroTrack Travel{% endblock %}
{% block content %}
<div class="login-form-icon"><i class="bi bi-key-fill" aria-hidden="true"></i></div>
<h2 class="login-form-title">Recuperar contraseña</h2>
<p class="login-form-sub">Te enviaremos un enlace de un solo uso a tu correo.</p>

{% if mensaje %}
<div class="flash-bar" role="status">
    <div class="flash-success toast-autodismiss"><i class="bi bi-check-circle-fill" aria-hidden="true"></i>{{ mensaje }}</div>
</div>
{% else %}
<form method="post" action="/recuperar-password" novalidate>
    <div class="mb-3">
        <label for="email" class="form-label-at">Correo electrónico</label>
        <input type="email" class="form-control-at" id="email" name="email" required autofocus>
    </div>
    <button type="submit" class="btn-at-primary w-100 justify-content-center mt-2" style="padding:11px 16px">
        Enviar enlace de recuperación
    </button>
</form>
{% endif %}

<a href="/login" class="d-inline-block mt-4" style="font-size:13px;color:var(--at-muted)">
    <i class="bi bi-arrow-left me-1"></i>Volver a iniciar sesión
</a>
{% endblock %}
