{% extends "base.html" %}
{% block title %}Recuperar contraseña — AeroTrack Travel{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
        <h1 class="h4 mb-4">Recuperar contraseña</h1>

        {% if mensaje %}
        <div class="alert alert-success toast-autodismiss" role="status">{{ mensaje }}</div>
        {% else %}
        <form method="post" action="/recuperar-password" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" name="email" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar enlace de recuperación</button>
        </form>
        {% endif %}

        <a href="/login" class="d-inline-block mt-3">Volver a iniciar sesión</a>
    </div>
</div>
{% endblock %}
